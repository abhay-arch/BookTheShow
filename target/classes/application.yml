spring:
  application:
    name: bookmyshow-backend
  
  cloud:
    config:
      enabled: false
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookmyshow}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms
      shutdown-timeout: 2000ms
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
      properties:
        delivery.timeout.ms: 120000
        linger.ms: 5
        batch.size: 16384
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:bookmyshow}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.bookmyshow.*"
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate
      concurrency: 3
  
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "bookmyshow:"
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,threaddump,heapdump
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.bookmyshow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/bookmyshow.log

bookmyshow:
  security:
    jwt:
      secret: ${JWT_SECRET:your-super-secret-key-min-256-bits-for-production}
      issuer: bookmyshow
      audience: bookmyshow-api
      access-token-expiry-minutes: 15
      refresh-token-expiry-days: 7
    oauth2:
      provider:
        keycloak:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bookmyshow}
          client-id: ${KEYCLOAK_CLIENT_ID:bookmyshow-client}
          client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  
  booking:
    seat-hold-duration-minutes: 10
    max-seats-per-booking: 10
    concurrency:
      lock-timeout-seconds: 10
      retry-attempts: 3
      retry-delay-ms: 100
  
  payment:
    idempotency-key-header: Idempotency-Key
    webhook:
      signature-header: X-Signature
      tolerance-seconds: 300
    provider:
      razorpay:
        key-id: ${RAZORPAY_KEY_ID:}
        key-secret: ${RAZORPAY_KEY_SECRET:}
        webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  
  search:
    page:
      default-size: 20
      max-size: 100
    sort:
      allowed-fields: releaseDate,title,rating,price
      default-field: releaseDate
      default-direction: desc
  
  cache:
    catalog:
      ttl-seconds: 300
      jitter-percent: 10
    show:
      ttl-seconds: 60
      jitter-percent: 20
    seat-availability:
      ttl-seconds: 30
      jitter-percent: 50
  
  rate-limit:
    auth:
      requests-per-minute: 10
    api:
      requests-per-minute: 100
    booking:
      requests-per-minute: 30