apiVersion: v1
kind: Namespace
metadata:
  name: bookmyshow
  labels:
    name: bookmyshow
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookmyshow-config
  namespace: bookmyshow
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SERVER_PORT: "8080"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster:9092"
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookmyshow-secrets
  namespace: bookmyshow
type: Opaque
stringData:
  DATABASE_URL: "jdbc:postgresql://postgres-primary:5432/bookmyshow"
  DATABASE_USERNAME: "postgres"
  DATABASE_PASSWORD: "changeme"
  JWT_SECRET: "your-super-secret-key-min-256-bits-for-production-use"
  KEYCLOAK_CLIENT_SECRET: "changeme"
  RAZORPAY_KEY_SECRET: "changeme"
  RAZORPAY_WEBHOOK_SECRET: "changeme"